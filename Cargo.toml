[package]
name = "chillie-back"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

jsonwebtoken = "9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy = "0.15"
thiserror = "2"

# Email OTP (signUp / verifyEmail).
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }
mrml = "6"           # MJML -> responsive HTML for the OTP email.
argon2 = "0.5"       # Hash the account password and the OTP.
rand = "0.8"         # Generate the OTP.
