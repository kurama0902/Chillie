services:
  db:
    image: postgres:16-alpine
    container_name: chillie-pg
    environment:
      POSTGRES_USER: chillie
      POSTGRES_PASSWORD: chillie
      POSTGRES_DB: chillie
    ports:
      - "5432:5432"
    volumes:
      - chillie_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chillie"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  chillie_pg:
